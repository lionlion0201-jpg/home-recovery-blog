name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 毎日 09:00 JST (00:00 UTC) に自動再ビルドし、予約公開(publishAt)の記事を反映する。
    # 2026-10-06: US には schedule が無く、push が無い日は予約記事が公開されなかった
    # (10/5 公開予定の記事が 10/6 朝になっても 404)。Actions の自動コミットは [skip ci] のため
    # デプロイを起こさない。JP と同じ設定にそろえた。
    - cron: "0 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 記事ごとの OG 画像(タイトル+サイト名)を og-images/ に生成する。
      # 画像は SNS・画像検索向けのおまけなので、ここが失敗しても止めずに
      # 画像なしでビルド・配信を続ける(テンプレートは画像が無ければタグを出さない)。
      # フォントはリポジトリの scripts/fonts/ に同梱しているため、ここでは入れない。
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.12"
      - name: Generate OG images
        continue-on-error: true
        run: |
          python -m pip install -r scripts/requirements-og.txt
          python scripts/generate_og_images.py
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
