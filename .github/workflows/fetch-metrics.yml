name: Fetch Metrics (X / Pinterest)

# Cowork(このリポジトリを自動運用しているサンドボックス環境)からは api.twitter.com への
# 通信がブロックされているため、メトリクス取得はここ(通常のインターネットアクセスを持つ
# GitHub Actionsのランナー)で行い、結果をcommitする。
# パイプラインはコミットされた docs/metrics/x_metrics.json を読むだけでよい。
#
# 併せて、台帳(docs/metrics/posted_assets.json)導入前に投稿したツイートを、
# 本文の一致でマニフェストと突き合わせて遡って登録する。

on:
  schedule:
    # 毎日 22:00 JST (13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      max_results:
        description: "直近何件の自分のツイートを対象にするか(5〜100)"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: "fetch-metrics"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      # 2026-09-28: X側の失敗(残高不足など)でジョブが止まり、後続のピン取得が一度も
      # 走っていなかった(Run 1〜8 すべて失敗、pin_metrics.json 未生成)。ピンは90日より
      # 古い期間が取れなくなるため、X側が失敗してもピン取得とコミットは続行する。
      # 失敗は最後のステップでジョブを失敗させて見えるようにする。
      - name: Fetch metrics
        id: fetch_x
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 未設定でも動くが、その場合は毎回 GET /2/users/me に約$0.01かかる。
          # Settings → Secrets and variables → Actions → Variables に X_USER_ID を登録すると節約できる。
          X_USER_ID: ${{ vars.X_USER_ID }}
        run: |
          python3 scripts/fetch_tweet_metrics.py \
            --max-results "${{ github.event.inputs.max_results || '50' }}"

      # Pinterest側で失敗してもツイート側の取得を巻き添えにしないよう continue-on-error。
      - name: Fetch pin metrics
        id: fetch_pin
        continue-on-error: true
        env:
          # 計測には読み取り専用トークンだけを渡す。投稿用の
          # PINTEREST_ACCESS_TOKEN はここでは意図的に渡していない
          # (計測処理に書き込み権限を持たせないため)。
          PINTEREST_READ_TOKEN: ${{ secrets.PINTEREST_READ_TOKEN }}
          # 登録されていれば毎回リフレッシュトークンからアクセストークンを作り直す(scripts/pinterest_auth.py)
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
        run: python3 scripts/fetch_pin_metrics.py --days 30

      # アフィリエイトリンクのクリック(affiliate_click)とセッション。X・Pinterest とは独立して動かす。
      - name: Fetch GA4 clicks
        id: fetch_ga4
        continue-on-error: true
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python3 scripts/fetch_ga4.py --days 30

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # まとめて add すると存在しないファイルが1つでもあると全体が失敗する
          # (X失敗で x_metrics.json が無い日にピンの結果まで捨てられる)ので1つずつ add する。
          for f in docs/metrics/x_metrics.json docs/metrics/pin_metrics.json docs/metrics/posted_assets.json docs/metrics/ga4_clicks.json docs/metrics/ga4_products.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update X / Pinterest metrics [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No metric changes to commit."
          fi

      - name: Report fetch failures
        if: steps.fetch_x.outcome == 'failure' || steps.fetch_pin.outcome == 'failure' || steps.fetch_ga4.outcome == 'failure'
        run: |
          echo "X: ${{ steps.fetch_x.outcome }} / Pinterest: ${{ steps.fetch_pin.outcome }} / GA4: ${{ steps.fetch_ga4.outcome }}"
          echo "GA4 が failure なら GA4_SA_KEY / GA4_PROPERTY_ID の登録と、サービスアカウントがプロパティの閲覧者になっているかを確認。"
          echo "X が failure なら上の Fetch metrics のログを確認(402=クレジット残高不足)。"
          echo "Pinterest が failure なら PINTEREST_READ_TOKEN の有無と pins:read スコープを確認。"
          exit 1
