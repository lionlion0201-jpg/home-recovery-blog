name: Post Pinterest Backlog

# 2026-07〜09に生成されたピン素材は、Trial accessとboard_idの不具合により
# 1枚も投稿されないまま manifest が .posted 扱いになっていた。
# 2026-09-17にStandard accessが承認されたため、その滞留分をここで消化する。
# X投稿には一切触れない(重複投稿とAPIコストを避けるため)。
#
# 新規アカウントの大量一括投稿はスパム判定のリスクがあるので、
# 1日数枚ずつのドリップ投稿にしている。
# 滞留分を消化し終えると "No pins left in the backlog." と出て何もしないので、
# そのまま放置しておいて問題ない。
on:
  schedule:
    # 毎日 10:00 JST (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      max_pins:
        description: "この実行で投稿するピンの最大枚数"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: "pinterest-backlog"
  cancel-in-progress: false

jobs:
  post-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Post pins from backlog
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_DEFAULT_BOARD_ID: ${{ secrets.PINTEREST_DEFAULT_BOARD_ID }}
        run: |
          python3 scripts/post_pin_backlog.py --max-pins "${{ github.event.inputs.max_pins || '4' }}"
      - name: Commit pin backlog state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cycles/.pins_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Pinterest backlog state [skip ci]"
            git pull --rebase
            git push
          else
            echo "No state change to commit"
          fi
