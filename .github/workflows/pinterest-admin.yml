name: Pinterest Admin (boards / fix pins)

# Pinterest のボードとピンをサイトのテーマに合わせて整える、手動実行専用のワークフロー(2026-10-17 追加)。
# 中身は scripts/pinterest_admin.py。apply を付けない実行は表示だけ(何も変更しない)。

on:
  workflow_dispatch:
    inputs:
      command:
        description: "boards = 一覧 / ensure-boards = テーマ別ボードを用意 / fix-pins = 投稿済みピンのボード移動と旧URL修正"
        type: choice
        default: "boards"
        options: ["boards", "ensure-boards", "fix-pins"]
      apply:
        description: "実際に変更する(外すと表示だけ)"
        type: boolean
        default: false
      limit:
        description: "fix-pins で変更する最大枚数(空なら全部)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: "pinterest-admin"
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run
        env:
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          CMD: ${{ github.event.inputs.command }}
          APPLY: ${{ github.event.inputs.apply }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args="$CMD"
          [ "$APPLY" = "true" ] && args="$args --apply"
          [ -n "$LIMIT" ] && args="$args --limit $LIMIT"
          python3 scripts/pinterest_admin.py $args
      - name: Commit board mapping
        if: github.event.inputs.command == 'ensure-boards' && github.event.inputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pinterest_boards.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: Pinterest のテーマ別ボードの ID を保存 [skip ci]"
            git pull --rebase --autostash
            git push
          fi
